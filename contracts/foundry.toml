[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# Remappings for cleaner imports
remappings = [
    "@interfaces/=src/interfaces/",
    "@peg/=src/peg/",
    "@fees/=src/fees/",
]

[fmt]
line_length = 100
bracket_spacing = true
int_types = "long"
