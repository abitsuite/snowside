[package]
name = "bmm-bidder"
version = "0.1.0"
edition = "2021"
description = "BMM bidder and settlement monitor for Snowside L1"
license = "MIT"

[dependencies]
# HTTP client for eCash RPC calls
reqwest = { version = "0.12", features = ["json"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error handling
anyhow = "1"
thiserror = "1"
# Config
toml = "0.8"
# CLI
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# Testing utilities will be added as needed
