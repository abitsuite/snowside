          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-api:
    needs: build-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: https://snowside.network/v1
    steps:
      - uses: actions/checkout@v5
      - name: Enable Corepack
