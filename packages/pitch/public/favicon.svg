<!-- packages/pitch/public/favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Snowside — dual snowmen forming 88">
  <!-- Dark rounded-square backdrop (keeps white snowmen visible on light browser themes) -->
  <rect width="64" height="64" rx="14" fill="#0a0f1a"/>

  <!-- Ambient snowfall -->
  <circle cx="10" cy="12" r="1.4" fill="#ffffff" opacity="0.35"/>
  <circle cx="54" cy="10" r="1.1" fill="#ffffff" opacity="0.3"/>
  <circle cx="32" cy="8" r="1.2" fill="#ffffff" opacity="0.25"/>

  <!-- LEFT SNOWMAN — Bitcoin (orange scarf, nose points right toward partner) -->
  <circle cx="20" cy="23" r="8.5" fill="#ffffff"/>
  <circle cx="20" cy="43" r="11" fill="#ffffff"/>
  <rect x="11" y="30.5" width="18" height="4.5" rx="2.25" fill="#f7931a"/>
  <circle cx="17" cy="21.5" r="1.1" fill="#0a0f1a"/>
  <circle cx="23" cy="21.5" r="1.1" fill="#0a0f1a"/>
  <path d="M20 24 L25.5 25.2 L20 26.6 Z" fill="#f7931a"/>

  <!-- RIGHT SNOWMAN — Avalanche (ice-blue scarf, nose points left toward partner) -->
  <circle cx="44" cy="23" r="8.5" fill="#ffffff"/>
  <circle cx="44" cy="43" r="11" fill="#ffffff"/>
  <rect x="35" y="30.5" width="18" height="4.5" rx="2.25" fill="#a0d0f0"/>
  <circle cx="41" cy="21.5" r="1.1" fill="#0a0f1a"/>
  <circle cx="47" cy="21.5" r="1.1" fill="#0a0f1a"/>
  <path d="M44 24 L38.5 25.2 L44 26.6 Z" fill="#f7931a"/>
</svg>
