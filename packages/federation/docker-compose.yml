services:
  federation:
    container_name: snowside-federation
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - API_URL=https://snowside.network/v1
      - MAINNET_RPC=https://rpc.snowside.network/mainnet
      - TESTNET_RPC=https://rpc.snowside.network/testnet
      - SIGNET_RPC=https://rpc.snowside.network/signet
      - MAINNET_ESPLORA=https://esplora.ecash.ninja
      - TESTNET_ESPLORA=https://esplora.beta.ecash.ninja
      - SIGNET_ESPLORA=https://esplora.signet.drivechain.info
      - POLL_MS=10000
